# Projet Xcode décrit en texte, généré par XcodeGen (`xcodegen generate`).
#
# Il remplace `Spog.xcodeproj`, qui n'est plus versionné : on développe sous Windows, sans
# Xcode, et un `project.pbxproj` ne s'édite pas à la main sans casse. La CI régénère le
# projet à chaque build ; sur un Mac, `brew install xcodegen && xcodegen generate` suffit.
name: Spog
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Analytics produit anonyme (pas d'ATT, pas d'identifiant), comme RepLock. Voir Core/Analytics.swift.
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Équipe de Mandalore LLC. L'ancienne équipe personnelle gratuite (82C2LNA792) ne peut
    # rien publier. La CI la repasse de toute façon via `vars.APPLE_TEAM_ID`.
    DEVELOPMENT_TEAM: GXS33F5JT9
    # Écrasé par la CI avec son numéro de lancement : chaque envoi TestFlight exige un
    # numéro de build neuf.
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Spog:
    type: application
    platform: iOS
    sources:
      # Dossier entier : le Swift est compilé, le reste (catalogue JSON, rendus, textes,
      # manifeste de confidentialité) part à plat dans le paquet, comme avant —
      # `CatalogStore` et `CarArt` les cherchent par nom à la racine de `Bundle.main`.
      - Spog
    settings:
      base:
        # Pas `com.mandaloregroup.spog` : cet identifiant reste réservé par l'équipe
        # personnelle gratuite, qui ne peut pas le libérer (même cas que Cyranox).
        # Les identifiants d'abonnement, eux, gardent `com.mandaloregroup.spog.premium.*` :
        # ils sont indépendants du bundle ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.mandalore-group.spog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        # Info.plist fusionné : Xcode génère la base, `Spog-Info.plist` n'ajoute que le
        # schéma d'URL des invitations, qu'aucun réglage de build ne sait exprimer.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Spog-Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "Spog utilise l'appareil photo pour capturer les voitures que tu croises dans la rue."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Spog utilise ta position pour savoir dans quel pays tu repères tes voitures. Seuls le pays et la ville sont conservés, jamais tes coordonnées."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # App iPhone en portrait seul : renoncer au multitâche iPad satisfait la validation
        # App Store sans déclarer les quatre orientations (leçon de RepLock).
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # Sign in with Apple : sert seulement à retrouver sa collection sur un autre appareil.
    # La CI active la capacité sur l'App ID toute seule (signature automatique + clé API).
    entitlements:
      path: Spog.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: TelemetryDeck
        product: TelemetryDeck

  SpogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpogTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mandalore-group.spog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Spog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Spog
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Spog

schemes:
  Spog:
    build:
      targets:
        Spog: all
    run:
      # Ne s'applique qu'à un lancement depuis Xcode, jamais à une IPA (voir CLAUDE.md).
      storeKitConfiguration: Spog.storekit
    test:
      targets:
        - SpogTests
